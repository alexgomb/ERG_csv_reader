name: Build Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Build standalone Windows executable
        run: pyinstaller --clean --noconfirm packaging/erg_reader.spec

      - name: Smoke test compiled executable
        run: |
          Test-Path dist\nBio_ERG_Trace.exe

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nBio_ERG_Trace-windows-x64
          path: dist/nBio_ERG_Trace.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/nBio_ERG_Trace.exe
